<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpFa Skill Tree</title>
    <link rel="icon" type="image/x-icon" href="favicon.png">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #c5c6c7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #parallax-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('/background.jpg');
            background-size: 200%;
            background-position: center;
            opacity: 0.4;
            z-index: 1;
            pointer-events: none;
        }

        #skill-tree-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
        }

        .tooltip {
            position: absolute;
            text-align: justify;
            padding: 12px;
            font-size: 14px;
            background: rgba(5, 5, 10, 0.95);
            border: 1px solid;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.2s;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
            color: #fff;
            z-index: 10;
            pointer-events: none;
        }

        .tooltip h2 {
            margin: 0 0 5px 0;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tooltip h3 {
            margin: 5px 0;
            text-align: center;
        }

        .node-label {
            pointer-events: none;
            font-size: 13px;
            fill: #ffffff;
            text-anchor: middle;
            font-weight: bold;
            text-shadow: 0px 2px 4px #000000, 0px -2px 4px #000000, 2px 0px 4px #000000, -2px 0px 4px #000000;
        }

        a {
            color: inherit;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div id="parallax-bg"></div>
    <div id="skill-tree-container"></div>
    <div id="tooltip" class="tooltip"></div>

    <script>
        // Node structure:
        //   name: "title" || null
        //   cluster: "type"
        //   rank: n (-1 = hide node)
        //   description: ["lines"] || "line" || null
        //   resources: [{ title: "name", authors: ["name"] || null, link: "https://..." || null }] || null
        //   unlocked: true || false || null
        //   children: [node] || null
        const skillTreeData = {
            name: "Git Gud", cluster: "base", rank: 0, description: "Git SCM Basics", resources: [{ title: "Pro Git", authors: ["Chacon", "Straub"], link: "https://git-scm.com/book/en/v2" }],
            children: [{
                name: "DEVELOPMENT", cluster: "development", rank: -1, description: null,
                children: [{
                    name: "Design Patterns", cluster: "development", rank: 1, description: null, resources: [{title: "Head First Design Patterns", authors: ["Freeman", "Robson"]}],
                    children: [{
                        name: "Pattern Systems", cluster: "development", rank: 2, description: null, resources: [{title: "Pattern Oriented Software Architecture - Volume 1", authors: ["Buschmann", "Meunier", "Rohnert", "Sommerlad", "Stal"]}],
                        children: [{
                            name: "Architectural Patterns", cluster: "development", rank: 3, description: null,
                            resources: [
                                {title: "Pattern Oriented Software Architecture - Volume 2", authors: ["Schmidt", "Stal", "Rohnert", "Buschmann"]},
                                {title: "Pattern Oriented Software Architecture - Volume 3", authors: ["Kircher", "Jain"]},
                                {title: "Pattern Oriented Software Architecture - Volume 4", authors: ["Buschmann", "Henney", "Schmidt"]},
                                {title: "Pattern Oriented Software Architecture - Volume 5", authors: ["Buschmann", "Henney", "Schmidt"]}
                            ]}
                        ]}, {
                        name: "Functional Programming", cluster: "development", rank: 2, description: ["Functional immutability, purity, operations (map, filter, reduce).", "Functional languages overview: Scheme, Racket, OCAML, Haskell."],
                        resources: [
                            {title: "The Little Schemer", authors: ["Friedman", "Felleisen"]},
                            {title: "Learn You a Haskell for Great Good!", authors: ["Lipovača"]}
                        ]}
                    ]
                }, {
                    name: "Algorithms and Data Structures", cluster: "development", rank: 1, description: "Lists, sets, maps, trees, sorting, searching", resources: [{title: "Data Structures and Algorithms", authors: ["Aho", "Hopcroft", "Ullman"]}],
                    children: [
                        { name: "Encodings and Formats", cluster: "development", rank: 2, description: ["Strings: charsets, encodings, unicode", "Time: dates, timezones, formats"]},
                        { name: "Algorithmic Efficiency", cluster: "development", rank: 2, description: ["Analyze algorithms and data structures space and time efficiency"], resources: [{title: "Introduction to Algorithms", authors: ["Cormen", "Leiserson", "Rivest", "Stein"]}],
                        children: [
                            { name: "Compilers", cluster: "development", rank: 3, description: "Compilers, programming languages formal semantics, type systems", resources: [{title: "Compilers", authors: ["Aho", "Lam", "Sethi", "Ullman"]}]},
                        ] }
                    ]
                }, {
                    name: "Java", cluster: "development", rank: 1, description: "Java 25 language (objects, methods, generics, lambdas)",
                    resources: [
                        {title: "Head First Java", authors: ["Sierra", "Bates"]},
                        {title: "Effective Java", authors: ["Bloch"]}
                    ],
                    children: [
                        { name: "Java API", cluster: "development", rank: 1, description: "Java API specification: java.util, java.util.concurrent, java.io, java.nio, java.time", resources: [{title: "Java® Platform Version 25 API Specification", link: "https://docs.oracle.com/en/java/javase/25/docs/api/"}]},
                        { name: "JUnit", cluster: "development", rank: 1, description: "Unit testing with JUnit", resources: [{title: "JUnit User Guide", link: "https://docs.junit.org/"}],
                        children: [
                            { name: "Integration Tests", cluster: "development", rank: 2, description: "Integration tests, JUnit runners, Spring runner"},
                        ]},
                        { name: "Maven", cluster: "development", rank: 1, description: "Maven goals, pom.xml", resources: [{title: "The Basics of Apache Maven", link: "https://www.baeldung.com/library/maven-ebook"}]},
                        { name: "Spring Framework", cluster: "development", rank: 2, description: "Web Application Development with Spring Framework", resources: [{title: "Spring Framework Documentation", link: "https://docs.spring.io/spring-framework/reference/"}],
                        children: [
                            { name: "Spring Data and Hibernate", cluster: "development", rank: 3, description: "JDBC, Hibernate, JPA, pagination, filtering, sorting"},
                            { name: "Spring Security", cluster: "development", rank: 3, description: "Spring Security filter chain, authentication methods, roles and authorities, method security"},
                        ]},
                    ]
                }, {
                    name: "HTML", cluster: "development", rank: 1, description: "HTML tags, classes, properties, styles", resources: [{title: "HTML&amp;CSS: Design and Build Websites", authors: ["Duckett"]}],
                    children: [
                        { name: "JavaScript", cluster: "development", rank: 1, description: null, resources: [{title: "JavaScript: the Good Parts", authors: ["Crockford"]}]}
                    ]
                }, {
                    name: "Rust", cluster: "development", rank: 2, description: null, resources: [{title: "Programming Rust", authors: ["Blandy", "Orendorff", "Tindall"]}]
                }, {
                    name: "Programming Languages", cluster: "development", rank: 3, description: "Overview of other programming languages and paradigms",
                    resources: [
                        {title: "Seven Languages in Seven Weeks", authors: ["Tate"]},
                        {title: "Seven More Languages in Seven Weeks", authors: ["Tate"]}
                    ]
                }]
            }, {
                name: "OPERATIONS", cluster: "operations", rank: -1, description: null, children: [{
                    name: "Linux Shell", cluster: "operations", rank: 1, description: null, resources: [
                        {title: "How Linux Works", authors: ["Ward"]},
                        {title: "Linux Bible", authors: ["Negus"]}
                    ],
                    children: [{
                        name: "make", cluster: "operations", rank: 1, description: "Makefiles", children: [
                            { name: "Ansible", cluster: "operations", rank: 2, description: "Ansible"}
                        ]}, {
                        name: "Cloud Basics", cluster: "operations", rank: 1, description: null, resources: [{title: "AWS Cloud Practitioner", link: "https://aws.amazon.com/certification/certified-cloud-practitioner/"}],
                        children: [
                            { name: "Terraform", cluster: "operations", rank: 2, description: "Terraform"},
                            { name: "Monitoring", cluster: "operations", rank: 2, description: "Cloud Monitoring Tools: Grafana, Prometheus, ..."}
                        ]}, {
                        name: "Operating Systems", cluster: "operations", rank: 3, description: null, resources: [{title: "Operating Systems", authors: ["Tanenbaum", "Woodhull"]}]}
                    ]
                }]
            }, {
                name: "SECURITY", cluster: "security", rank: -1, description: null, children: [{
                    name: "Cyber Hygiene", cluster: "security", rank: 1, description: null, resources: [{title: "Cyber Hygiene", authors: ["European Union Agency for Cybersecurity"], link: "https://www.enisa.europa.eu/topics/cyber-hygiene"}],
                    children: [{
                        name: "Vulnerabilities", cluster: "security", rank: 2, description: "Buffer overflow, XSS, CSRF",
                        children: [
                            { name: "Security Reports", cluster: "security", rank: 3, description: "Understand security reports and fix open vulnerabilities" }
                        ]}, {
                        name: "Application Security", cluster: "security", rank: 2, description: "AAA, ...",
                        children: [
                            { name: "Keycloak", cluster: "security", rank: 3, description: "IDM configuration, management and integration"},
                            { name: "Hardening", cluster: "security", rank: 3, description: "Proxy, HSTS, CSP, CSRF, XSS protection, cookies, ..."}
                        ]}, {
                        name: "Security Protocols", cluster: "security", rank: 2, description: "SSH, TLS, PKI, ...",
                        children: [
                            { name: "Cryptography", cluster: "security", rank: 3, description: null, resources: [
                                {title: "Applied Cryptography", authors: ["Schneier"]},
                                {title: "Cryptography Engineering", authors: ["Ferguson", "Schneier", "Kohno"]}
                            ]}
                        ]}
                    ]
                }]
            }, {
                name: "NETWORKING", cluster: "networking", rank: -1, description: null,
                children: [{
                    name: "Networking Basics", cluster: "networking", rank: 1, description: null, resources: [
                        {title: "Computer Networks", authors: ["Tanenbaum", "Wetherall"]},
                        {title: "Cisco CCNA Official Cert Guide", authors: ["Odom"]}
                    ],
                    children: [{
                        name: "L7 Protocols", cluster: "networking", rank: 2, description: "Application Layer Protocols: HTTP(s), SSH, ...",
                        children: [
                            { name: "Network Protocols", cluster: "networking", rank: 3, description: "Common protocols: DNS, DHCP, ..." },
                            { name: "Traffic Capture", cluster: "networking", rank: 3, description: "Wireshark, tcpdump, pcap, captured traffic analysis" },
                        ]},
                        { name: "Firewall", cluster: "networking", rank: 2, description: "Linux firewall configuration" },
                        { name: "VPN", cluster: "networking", rank: 2, description: "VPN setup, SSH tunnelling" }
                    ]
                }]
            }, {
                name: "ORGANIZATION", cluster: "base", rank: -1, description: null,
                children: [{
                    name: "Learning", cluster: "base", rank: 1, description: [
                        "Rendiconta le proprie ore su progetto con precisione",
                        "Trova in autonomia le voci di rendicontazione",
                        "Riporta correttemente eventi significativi e criticità di progetto (mancanza di feedback dal cliente, sovraccarico, etc...)",
                        "Chiede le priorità di sviluppo e gestisce il proprio tempo in base alle informazioni ricevute",
                        "Focus su singolo task (necessita di supporto per task multipli)"
                    ],
                    children: [{
                        name: "Being Familiar", cluster: "base", rank: 2, description: [
                            "È in grado di identificare i problemi organizzativi (es. problemi di comunicazione, sovrapposizioni tra persone diverse, mancato contatto diretto col cliente, processi disfunzionali) e formulare possibili soluzioni (anche qualora non fosse in grado di applicarle)",
                            "È in grado di decidere le priorità e le dipendenze tra i vari task relativi ad un progetto e organizza il proprio tempo in base a questo",
                            "È in grado di gestire le proprie assenza prolungate (ferie previste da tempo) gestendo la comunicazione coi colleghi con cui lavora.",
                            "Stima tempo e effort necessari per le proprie attività, traccia l'avanzamento e identifica scostamenti.",
                            "Rispetta le deadline condivise, gestendo proattivamente gli scostamenti.",
                            "Focus su task multipli su singolo progetto."
                        ]},
                    ]}
                ]
            }, {
                name: "PRINCIPLES", cluster: "principles", rank: -1, description: null,
                children: [{
                    name: "Agile", cluster: "principles", rank: 1, description: null, resources: [{title: "Manifesto for Agile Software Development", link: "https://agilemanifesto.org/"}],
                    children: [{
                        name: "Clean Code", cluster: "principles", rank: 1, description: "Agile principles, SOLID, TDD", resources: [
                            {title: "Clean Code: A Handbook of Agile Software Craftsmanship", authors: ["Martin"]},
                            {title: "97 Things Every Programmer Should Know", authors: ["Henney"]}
                        ]}, {
                        name: "Lean", cluster: "principles", rank: 1, description: null, resources: [{title: "Lean Software Development", authors: ["Poppendieck"]}],
                        children: [
                            { name: "A3 Thinking", cluster: "principles", rank: 2, description: "Collaborative Problem Solving" }
                        ]}
                    ]
                }]
            }, {
                name: "COMMUNICATION", cluster: "base", rank: -1, description: null,
                children: [{
                    name: "Learning", cluster: "base", rank: 1, description: [
                        "Capace di relazionarsi in modo efficace e costruttivo con i colleghi",
                        "Impiega un registro di comunicazione corretto (incluso livello di formalità) appropriato al contesto ed all'interlocutore",
                        "Garantisce il corretto trattamento delle informazioni in base alla loro riservatezza",
                        "Capace di ricevere feedback"
                    ],
                    children: [{
                        name: "Being Familiar", cluster: "base", rank: 2, description: [
                            "Capace di relazionarsi con il personale operativo del cliente",
                            "Produttivo ed efficace nella stesura di documentazione tecnica ed operativa",
                            "Si esprime in modo lucido e costruttivo anche in situazioni di conflitto",
                            "Attivamente chiede e dà feedback ai colleghi",
                            "Evita sottintesi, esplicitando e completando i propri ragionamenti",
                            "Attento e capace ad identificare divergenze nell'interpretazione di informazioni tra se e gli interlocutori"
                        ]}
                    ]}
                ]
            }, {
                name: "PROACTIVITY", cluster: "base", rank: -1, description: null,
                children: [{
                    name: "Learning", cluster: "base", rank: 1, description: [
                        "Saper cercare in autonomia le informazioni tra le sorgenti a disposizione",
                        "Saper alzare la mano al momento giusto (tradeoff tra autonomia e necessità di supporto)",
                        "Focus sulla propria persona"
                    ],
                    children: [{
                        name: "Being Familiar", cluster: "base", rank: 2, description: [
                            "Autonomia nell'individuazione di sorgenti di informazione",
                            "Autonomia nel portare il contesto della criticità",
                            "Cerca proattivamente consenso sulle decisioni rischiose",
                            "Focus su propri task",
                            "Traccia un proprio percorso all'interno dell'azienda (sia formativo sia di responsabilità) e lo persegue con il supporto degli altri, valutandone il progresso"
                        ]}
                    ]}
                ]
            }, {
                name: "VISION", cluster: "base", rank: -1, description: null,
                children: [{
                    name: "OptionFactory", cluster: "base", rank: 1, description: "Company culture, market and offering",
                    children: [{
                        name: "Organizational Model", cluster: "base", rank: 2, description: "Company structure, micro-entrepreneurial approach", resources: [{title: "Handbook For New Employees", authors: ["VALVE"], link: "https://cdn.fastly.steamstatic.com/apps/valve/Valve_NewEmployeeHandbook.pdf"}],
                        children: [
                            { name: "Vision", cluster: "base", rank: 3, description: "Business vision, trade-offs, initiative propositions"}
                        ] }
                    ]}
                ]
            }]
        };

        const clusterColors = {
            base: "#ffffff", // Pure White
            development: "#33ccff", // Power Azure
            operations: "#33ff33", // Console Green
            security: "#ff3333", // Threat Red
            networking: "#dd33ff", // Connection Violet
            principles: "#ccaa33" // Enlighting Yellow
        };

        const width = window.innerWidth;
        const height = window.innerHeight;
        const radius = 1000;

        const parallaxBg = document.getElementById('parallax-bg');

        const zoom = d3.zoom()
            .scaleExtent([0.4, 2.5])
            .on("zoom", (event) => {
                svgGroup.attr("transform", event.transform);
                const parallaxMultiplier = 0.3;
                const bgX = event.transform.x * parallaxMultiplier;
                const bgY = event.transform.y * parallaxMultiplier;
                parallaxBg.style.backgroundPosition = `calc(50% + ${bgX}px) calc(50% + ${bgY}px)`;
            });

        const svg = d3.select("#skill-tree-container")
            .append("svg")
            .attr("width", width)
            .attr("height", height)
            .call(zoom);

        // Center tree and zoom
        const svgGroup = svg.append("g")
            .attr("transform", `translate(${width / 2},${height / 2}) scale(1)`);
        svg.call(zoom.transform, d3.zoomIdentity.translate(width / 2, height / 2));

        const glowFilters = svg.append("glowFilters");
        const filter = glowFilters.append("filter")
            .attr("id", "glow")
            .attr("x", "-50%").attr("y", "-50%")
            .attr("width", "200%").attr("height", "200%");
        filter.append("feGaussianBlur").attr("stdDeviation", "6").attr("result", "coloredBlur");
        const feMerge = filter.append("feMerge");
        feMerge.append("feMergeNode").attr("in", "coloredBlur");
        feMerge.append("feMergeNode").attr("in", "SourceGraphic");

        const root = d3.hierarchy(skillTreeData);
        const treeLayout = d3.tree()
            .size([2 * Math.PI, radius])
            .separation((a, b) => ((a.parent == b.parent ? 1 : 2) + (a.data.cluster === b.data.cluster ? 0 : 1) + (a.data.rank === b.data.rank ? 0 : 1)) + a.depth/2);
        treeLayout(root);

        const linkGenerator = d3.linkRadial()
            .angle(d => d.x)
            .radius(d => d.y);
        const radialLine = d3.lineRadial()
            .angle(d => d.x)
            .radius(d => d.y);
        const lineGenerator = d => radialLine([d.source, d.target]);
        svgGroup.selectAll(".link")
            .data(root.links())
            .enter()
            .append("path")
            .attr("class", "link")
            .attr("fill", "none")
            .attr("stroke", d => clusterColors[d.target.data.cluster] || "#555")
            .attr("stroke-width", 4)
            .attr("stroke-opacity", d => d.target.data.unlocked ? 0.8 : 0.2)
            .attr("d", d => d.target.data.rank < 0 ? lineGenerator(d) : linkGenerator(d))
            .style("transition", "stroke-opacity 0.4s ease");

        const describeResource = (res) => {
            const authors = res.authors || [];
            var text = `<strong>${res.title}</strong>`;
            if (!!authors.length) {
                text = text + ` &mdash; <em>${authors.join(", ")}</em>`;
            }
            if (!!res.link) {
                text = `<a href="${res.link}" target="_blank">${text}</a>`;
            }
            return text;
        };

        // Node:
        //   name: "title" || null
        //   description: ["lines"] || "line" || null
        //   resources: [{ title: "name", authors: ["name"] || null, link: "https://..." || null }] || null
        const describe = (node) => {
            const color = clusterColors[node.cluster];
            const description = node.description || [];
            const lines = Array.isArray(description) ? description : [description];
            const resources = node.resources || [];
            return `
            <h2 style="color:${color}">${node.name}</h2>
            <div style="color:#ddd;">
                <p>${lines.join('<br>')}</p>
            </div>
            <h3><em>Resources:</em></h3>
            <div>
                ${resources.map(r => `<p>${describeResource(r)}</p>`).join("")}
            </div>
            `;
        };

        const node = svgGroup.selectAll(".node")
            .data(root.descendants())
            .enter()
            .append("g")
            .attr("class", "node")
            .attr("transform", d => `translate(${d.y * Math.cos(d.x - Math.PI/2)},${d.y * Math.sin(d.x - Math.PI/2)})`)
            .style("cursor", d => d.data.rank < 0 ? "default" : "pointer")
            .on("mouseenter", function(event, d) {
                if (d.data.rank < 0) { return; }
                const tooltip = d3.select("#tooltip");
                const color = clusterColors[d.data.cluster];
                tooltip.html(describe(d.data))
                    .style("left", (event.pageX + 15) + "px")
                    .style("top", (event.pageY - 28) + "px")
                    .style("border-color", color)
                    .transition("tooltip-show").duration(500).style("opacity", 1);

                d3.select(this).select("circle")
                    .transition("circle-grow").duration(500)
                    .attr("r", 28);
            })
            .on("mouseout", function(event, d) {
                d3.select("#tooltip")
                    .transition("tooltip-sustain").duration(5000)
                    .transition("tooltip-hide").duration(500).style("opacity", 0);
                d3.select(this).select("circle")
                    .transition("circle-shrink").duration(500)
                    .attr("r", 22);
            })
            .on("click", function(event, d) {
                if (d.depth < 0 || d.data.rank < 0) return;

                d.data.unlocked = !d.data.unlocked;

                d3.select(this).select("circle")
                    .transition("circle-light").duration(1500)
                    .attr("fill", d.data.unlocked ? clusterColors[d.data.cluster] : "#111")
                    .attr("stroke-width", d.data.unlocked ? 4 : 2)
                    .attr("stroke-opacity", d.data.unlocked ? 1 : 0.75)
                    .attr("filter", d.data.unlocked ? "url(#glow)" : "url(#glow)");

                const leadingToTarget = (l, n) => {
                    if (l.target === n) { return true; }
                    if (n.parent) { return leadingToTarget(l, n.parent); }
                    return false;
                }

                svgGroup.selectAll(".link")
                    .filter(l => leadingToTarget(l, d))
                    .transition("link-light").duration(300)
                    .attr("stroke-opacity", d.data.unlocked ? 0.8 : 0.2);
            });

        node.append("circle")
            .attr("r", 22)
            .attr("pointer-events", d => d.data.rank < 0 ? "none" : "auto")
            .attr("fill", d => d.data.rank < 0 ? "#00000000" : d.data.unlocked ? clusterColors[d.data.cluster] : "#111")
            .attr("stroke", d => d.data.rank < 0 ? "#00000000" : clusterColors[d.data.cluster])
            .attr("stroke-dasharray", d => {
                switch (d.data.rank) {
                    case 0: return "60,10";
                    case 1: return "35,10";
                    case 2: return "18,10";
                    case 3: return "9,10";
                    default: return "none";
                }
            })
            .attr("stroke-width", d => d.data.unlocked ? 4 : 2)
            .attr("stroke-opacity", d => d.data.unlocked ? 1 : 0.75)
            .attr("filter", d => d.data.unlocked ? "url(#glow)" : "url(#glow)")
            .attr("transform", d => `rotate(${d.x}, 0, 0)`)
            .style("transition", "fill 0.3s ease, stroke-width 0.3s ease");

        node.append("text")
            .attr("class", "node-label")
            .attr("dy", d => Math.cos(d.x) < 0 ? 50 : -50)
            .text(d => d.data.name);
    </script>
</body>
</html>
